name: CI

on:
  - push
  - pull_request
  - workflow_dispatch

jobs:

  Build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4

      - name: Build
        run: dotnet build

      - name: Pack
        run: dotnet pack
